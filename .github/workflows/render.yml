# Clip Farm precision editor on GitHub Actions ($0 on a public repo).
# n8n (Clip Farm Query > "Auto-Edit API (Clip Farm Render)") sends a repository_dispatch "clipfarm-render" per clip.
# This job renders the 1080x1920 safe-zone edit, runs verify_edit.py (auto-revises), uploads the MP4 to the
# "renders" release and calls n8n back. It never posts to social media.
name: render

on:
  repository_dispatch:
    types: [clipfarm-render]
  workflow_dispatch:
    inputs:
      clip_id: { description: 'Queue clip_id', required: true }
      source_url: { description: 'Licensed source video URL', required: true }
      start: { description: 'Start second', required: true }
      end: { description: 'End second', required: true }
      title: { description: 'Hook / title (<= 7 words)', required: true }
      callback_url: { description: 'n8n Callbacks URL (editor=farm)', required: true }

permissions:
  contents: write   # upload the MP4 to the "renders" release

concurrency:
  group: render-${{ github.event.client_payload.clip_id || github.event.inputs.clip_id }}
  cancel-in-progress: false

jobs:
  # 1) Home PC (self-hosted runner labelled "clipfarm-home", residential internet): ONLY talks to YouTube.
  #    Downloads the licensed clip window (or runs the moment scan) so YouTube never sees a datacenter IP. No cookies needed.
  #    If the PC is off, this job waits in the queue until it is back on; nothing posts either way.
  fetch:
    runs-on: [self-hosted, clipfarm-home]
    timeout-minutes: 30
    continue-on-error: true
    env:
      CLIPFARM_STAGE: fetch
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: YouTube tools (yt-dlp, JS solver, portable ffmpeg)
        run: python -m pip install -q -U "yt-dlp[default]" deno imageio-ffmpeg
      - name: Fetch from the home connection
        run: python editor/gh_job.py
      - name: Hand the clip window to the GitHub render job
        uses: actions/upload-artifact@v4
        with:
          name: fetched
          path: fetched/
          if-no-files-found: ignore
          retention-days: 1

  # 2) GitHub runner: renders, verifies, uploads and calls n8n back (unchanged), using the window fetched at home.
  render:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLIPFARM_STAGE: render
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Clip window fetched by the home PC
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fetched
          path: fetched

      - name: System tools (ffmpeg, tesseract, font)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr
          mkdir -p fonts
          curl -sSL -o fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf

      - name: Python packages
        run: pip install -q -r requirements.txt yt-dlp

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1

      - name: Optional YouTube cookies (fallback only, if the home fetch did not run)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Render + verify + deliver
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPFARM_FONT: ${{ github.workspace }}/fonts/Poppins-Bold.ttf
        run: python editor/gh_job.py

      - name: Keep the verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: renders/**/*.report.json
          if-no-files-found: ignore
          retention-days: 30
